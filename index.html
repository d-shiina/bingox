<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴカード生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ===== SCREEN CARD LAYOUT (Tailwindで代替できない部分のみ) ===== */
    .bingo-card {
      width: clamp(260px, calc(50% - 12px), 400px);
      border: 3px solid #1a237e;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(26,35,126,0.15);
    }
    .bingo-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #1a237e;
    }
    .bingo-header-cell {
      color: white;
      font-size: clamp(22px, 4.5vw, 44px);
      font-weight: 900;
      text-align: center;
      padding: 4% 0;
      border-right: 1px solid rgba(255,255,255,0.15);
    }
    .bingo-header-cell:last-child { border-right: none; }
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }
    .bingo-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 5.5vw, 60px);
      font-weight: 800;
      border: 1px solid #9fa8da;
      color: #1a237e;
      background: white;
    }
    .bingo-cell.free-cell {
      background: #fff9c4;
      font-size: clamp(13px, 2.8vw, 30px);
      font-weight: 900;
      color: #f57f17;
      letter-spacing: 1px;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-950 via-indigo-900 to-slate-900 text-white">

  <!-- Hero header -->
  <div class="text-center pt-12 pb-8 px-4">
    <div class="text-5xl mb-3">🎯</div>
    <h1 class="text-4xl font-black tracking-widest text-white drop-shadow-lg">ビンゴカード生成</h1>
    <p class="text-indigo-300 mt-2 text-sm tracking-wide">A4横・2枚組 PDF出力対応</p>
  </div>

  <!-- Settings card -->
  <div class="max-w-md mx-auto px-4 pb-6">
    <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-6 shadow-2xl">

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-indigo-200 uppercase tracking-widest">最小値</label>
          <input type="number" id="numMin" value="1" min="1" max="999"
            class="bg-white/15 border border-white/30 rounded-xl px-4 py-3 text-white text-lg font-bold
                   focus:outline-none focus:border-indigo-300 focus:bg-white/20 transition text-center
                   [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-indigo-200 uppercase tracking-widest">最大値</label>
          <input type="number" id="numMax" value="75" min="1" max="999"
            class="bg-white/15 border border-white/30 rounded-xl px-4 py-3 text-white text-lg font-bold
                   focus:outline-none focus:border-indigo-300 focus:bg-white/20 transition text-center
                   [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-indigo-200 uppercase tracking-widest">生成枚数</label>
          <input type="number" id="numCards" value="2" min="1" max="100"
            class="bg-white/15 border border-white/30 rounded-xl px-4 py-3 text-white text-lg font-bold
                   focus:outline-none focus:border-indigo-300 focus:bg-white/20 transition text-center
                   [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-indigo-200 uppercase tracking-widest">中央マス</label>
          <select id="centerType"
            class="bg-white/15 border border-white/30 rounded-xl px-4 py-3 text-white text-base font-bold
                   focus:outline-none focus:border-indigo-300 focus:bg-white/20 transition cursor-pointer">
            <option value="free" class="text-gray-900">FREE（穴あき）</option>
            <option value="number" class="text-gray-900">数字</option>
          </select>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3">
        <button onclick="generateCards()"
          class="flex-1 bg-gradient-to-r from-emerald-500 to-green-400 hover:from-emerald-400 hover:to-green-300
                 text-white font-black text-lg py-3.5 rounded-xl shadow-lg shadow-emerald-900/40
                 active:scale-95 transition-all duration-150 tracking-wide">
          ✦ 生成
        </button>
        <button id="printBtn" onclick="printCards()" style="display:none"
          class="flex-1 bg-gradient-to-r from-sky-500 to-blue-400 hover:from-sky-400 hover:to-blue-300
                 text-white font-black text-lg py-3.5 rounded-xl shadow-lg shadow-blue-900/40
                 active:scale-95 transition-all duration-150 tracking-wide">
          ↓ PDF
        </button>
      </div>

    </div>
  </div>

  <!-- Card preview -->
  <div id="cardsPreview" class="px-4 pb-16"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let generatedCards = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateCells(min, max, centerFree) {
      const needed = centerFree ? 24 : 25;
      const pool = [];
      for (let i = min; i <= max; i++) pool.push(i);
      if (pool.length < needed) {
        alert(`数字の範囲が足りません。${needed}個以上の数字が必要ですが、現在 ${pool.length} 個です。`);
        return null;
      }
      const nums = shuffle(pool).slice(0, needed);
      const cells = [];
      for (let i = 0; i < 25; i++) {
        if (centerFree && i === 12) {
          cells.push(null);
        } else {
          cells.push(nums.pop());
        }
      }
      return cells;
    }

    function cardHTML(cells) {
      const headers = ['B', 'I', 'N', 'G', 'O'];
      let h = '<div class="bingo-card">';
      h += '<div class="bingo-header">';
      for (const ch of headers) {
        h += `<div class="bingo-header-cell">${ch}</div>`;
      }
      h += '</div><div class="bingo-grid">';
      for (const val of cells) {
        if (val === null) {
          h += '<div class="bingo-cell free-cell">FREE</div>';
        } else {
          h += `<div class="bingo-cell">${val}</div>`;
        }
      }
      h += '</div></div>';
      return h;
    }

    function generateCards() {
      const min = parseInt(document.getElementById('numMin').value, 10);
      const max = parseInt(document.getElementById('numMax').value, 10);
      const count = parseInt(document.getElementById('numCards').value, 10);
      const centerFree = document.getElementById('centerType').value === 'free';

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('最小値は最大値より小さい値を入力してください。');
        return;
      }

      const preview = document.getElementById('cardsPreview');
      preview.innerHTML = '';
      generatedCards = [];

      for (let i = 0; i < count; i++) {
        const cells = generateCells(min, max, centerFree);
        if (!cells) return;
        generatedCards.push(cells);
      }

      for (let i = 0; i < generatedCards.length; i += 2) {
        const page = document.createElement('div');
        page.className = 'max-w-3xl mx-auto mb-6 bg-white/5 border border-white/10 rounded-2xl p-6 flex flex-wrap gap-5 justify-center';
        page.innerHTML = cardHTML(generatedCards[i]);
        if (generatedCards[i + 1]) page.innerHTML += cardHTML(generatedCards[i + 1]);
        preview.appendChild(page);
      }

      document.getElementById('printBtn').style.display = '';
      document.getElementById('cardsPreview').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== Canvas → PDF print =====
    const PW = 1748, PH = 1240, PAD = 60, GAP = 48;

    function drawCard(ctx, cells, x, y, w, h) {
      const cellW = w / 5;
      const cellH = cellW;
      const HEADER_H = h - cellH * 5;

      ctx.fillStyle = 'white';
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = '#1a237e';
      ctx.fillRect(x, y, w, HEADER_H);

      const headers = ['B', 'I', 'N', 'G', 'O'];
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.round(HEADER_H * 0.72)}px Arial, sans-serif`;
      for (let i = 0; i < 5; i++) {
        ctx.fillText(headers[i], x + cellW * i + cellW / 2, y + HEADER_H / 2);
      }

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const idx = row * 5 + col;
          const cx = x + cellW * col;
          const cy = y + HEADER_H + cellH * row;
          const val = cells[idx];

          if (val === null) {
            ctx.fillStyle = '#fff9c4';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#f57f17';
            ctx.font = `900 ${Math.round(cellH * 0.38)}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('FREE', cx + cellW / 2, cy + cellH / 2);
          } else {
            ctx.fillStyle = 'white';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#1a237e';
            const text = String(val);
            let fontSize = Math.round(cellH * 0.85);
            ctx.font = `800 ${fontSize}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            while (ctx.measureText(text).width > cellW * 0.86 && fontSize > 20) {
              fontSize -= 2;
              ctx.font = `800 ${fontSize}px Arial, sans-serif`;
            }
            ctx.fillText(text, cx + cellW / 2, cy + cellH / 2);
          }

          ctx.strokeStyle = '#9fa8da';
          ctx.lineWidth = 2;
          ctx.strokeRect(cx, cy, cellW, cellH);
        }
      }

      ctx.strokeStyle = '#1a237e';
      ctx.lineWidth = 6;
      ctx.strokeRect(x, y, w, h);
    }

    function printCards() {
      if (generatedCards.length === 0) return;

      const cardW = Math.round((PW - PAD * 2 - GAP) / 2);
      const cellW = cardW / 5;
      const headerH = Math.round(cellW * 0.8);
      const cardH = headerH + Math.round(cellW * 5);
      const cardY = PAD + Math.round((PH - PAD * 2 - cardH) / 2);
      const dataURLs = [];

      for (let i = 0; i < generatedCards.length; i += 2) {
        const canvas = document.createElement('canvas');
        canvas.width = PW;
        canvas.height = PH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, PW, PH);
        drawCard(ctx, generatedCards[i], PAD, cardY, cardW, cardH);
        if (generatedCards[i + 1]) {
          drawCard(ctx, generatedCards[i + 1], PAD + cardW + GAP, cardY, cardW, cardH);
        }
        dataURLs.push(canvas.toDataURL('image/png'));
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      for (let i = 0; i < dataURLs.length; i++) {
        if (i > 0) doc.addPage();
        doc.addImage(dataURLs[i], 'PNG', 0, 0, 297, 210);
      }

      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
