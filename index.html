<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴカード生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Roboto', 'sans-serif'] },
          colors: {
            primary:   { DEFAULT: '#303F9F', light: '#3F51B5', dark: '#1A237E' },
            surface:   '#FFFFFF',
            bg:        '#ECEFF1',
            'on-primary': '#FFFFFF',
            'text-primary':   '#212121',
            'text-secondary': '#757575',
          },
          boxShadow: {
            'md1': '0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24)',
            'md2': '0 3px 6px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.12)',
            'md4': '0 10px 20px rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.10)',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Roboto', sans-serif; }

    /* Outlined text field */
    .md-field { position: relative; }
    .md-field label {
      position: absolute; top: -9px; left: 12px;
      font-size: 11px; font-weight: 500; letter-spacing: .6px;
      color: #303F9F; background: white; padding: 0 4px;
      text-transform: uppercase;
    }
    .md-field input, .md-field select {
      width: 100%; border: 1.5px solid #BDBDBD; border-radius: 4px;
      padding: 14px 16px; font-size: 16px; font-family: 'Roboto Mono', monospace;
      font-weight: 700; color: #212121; background: white;
      transition: border-color .2s; outline: none; appearance: none;
    }
    .md-field input:focus, .md-field select:focus { border-color: #303F9F; border-width: 2px; }

    /* Contained button */
    .md-btn {
      font-family: 'Roboto', sans-serif;
      font-size: 14px; font-weight: 500; letter-spacing: 1.25px;
      text-transform: uppercase; border: none; border-radius: 4px;
      padding: 0 24px; height: 48px; cursor: pointer;
      transition: box-shadow .2s, filter .15s;
      position: relative; overflow: hidden;
    }
    .md-btn:hover { filter: brightness(1.08); }
    .md-btn:active { filter: brightness(0.94); box-shadow: none !important; }

    /* Bingo card */
    .bingo-card {
      width: clamp(260px, calc(50% - 12px), 400px);
      border: 2px solid #1A237E; border-radius: 2px; overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.12);
    }
    .bingo-header {
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: #1A237E;
    }
    .bingo-header-cell {
      color: white; font-size: clamp(20px, 4.2vw, 42px); font-weight: 700;
      text-align: center; padding: 4% 0;
      border-right: 1px solid rgba(255,255,255,.12);
    }
    .bingo-header-cell:last-child { border-right: none; }
    .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); }
    .bingo-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: clamp(22px, 5vw, 56px); font-weight: 700;
      border: 1px solid #C5CAE9; color: #1A237E; background: white;
    }
    .bingo-cell.free-cell {
      background: #FFF8E1; font-size: clamp(12px, 2.6vw, 28px);
      font-weight: 700; color: #E65100; letter-spacing: .5px;
    }
  </style>
</head>

<body class="bg-[#ECEFF1] min-h-screen text-[#212121]">

  <!-- Top App Bar -->
  <header class="bg-[#303F9F] shadow-md4 px-6 py-4 flex items-center gap-4">
    <svg class="w-7 h-7 text-white opacity-90" fill="currentColor" viewBox="0 0 24 24">
      <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 14l-5-5h10l-5 5z"/>
    </svg>
    <h1 class="text-white text-xl font-medium tracking-wide">ビンゴカード生成</h1>
  </header>

  <main class="max-w-lg mx-auto px-4 py-8">

    <!-- Settings card -->
    <div class="bg-white rounded shadow-md2 p-6 mb-4">
      <p class="text-xs font-medium text-[#757575] uppercase tracking-widest mb-5">設定</p>

      <div class="grid grid-cols-2 gap-6 mb-6">
        <div class="md-field">
          <label>最小値</label>
          <input type="number" id="numMin" value="1" min="1" max="999">
        </div>
        <div class="md-field">
          <label>最大値</label>
          <input type="number" id="numMax" value="75" min="1" max="999">
        </div>
        <div class="md-field">
          <label>生成枚数</label>
          <input type="number" id="numCards" value="2" min="1" max="100">
        </div>
        <div class="md-field">
          <label>中央マス</label>
          <select id="centerType">
            <option value="free">FREE</option>
            <option value="number">数字</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 justify-end pt-2 border-t border-[#EEEEEE]">
        <button onclick="generateCards()" class="md-btn bg-[#303F9F] text-white shadow-md1">
          生成
        </button>
        <button id="printBtn" onclick="printCards()" style="display:none"
          class="md-btn bg-[#00796B] text-white shadow-md1">
          PDF出力
        </button>
      </div>
    </div>

    <!-- Hint -->
    <p class="text-xs text-[#9E9E9E] text-center tracking-wide">
      PDF出力後、iOSの共有メニューからプリント
    </p>

  </main>

  <!-- Card preview -->
  <section id="cardsPreview" class="px-4 pb-16 max-w-3xl mx-auto"></section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let generatedCards = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateCells(min, max, centerFree) {
      const needed = centerFree ? 24 : 25;
      const pool = [];
      for (let i = min; i <= max; i++) pool.push(i);
      if (pool.length < needed) {
        alert(`数字の範囲が足りません。${needed}個以上必要ですが現在 ${pool.length} 個です。`);
        return null;
      }
      const nums = shuffle(pool).slice(0, needed);
      const cells = [];
      for (let i = 0; i < 25; i++) {
        cells.push((centerFree && i === 12) ? null : nums.pop());
      }
      return cells;
    }

    function cardHTML(cells) {
      const headers = ['B','I','N','G','O'];
      let h = '<div class="bingo-card"><div class="bingo-header">';
      for (const ch of headers) h += `<div class="bingo-header-cell">${ch}</div>`;
      h += '</div><div class="bingo-grid">';
      for (const val of cells) {
        h += val === null
          ? '<div class="bingo-cell free-cell">FREE</div>'
          : `<div class="bingo-cell">${val}</div>`;
      }
      return h + '</div></div>';
    }

    function generateCards() {
      const min  = parseInt(document.getElementById('numMin').value, 10);
      const max  = parseInt(document.getElementById('numMax').value, 10);
      const count = parseInt(document.getElementById('numCards').value, 10);
      const centerFree = document.getElementById('centerType').value === 'free';

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('最小値は最大値より小さくしてください。');
        return;
      }

      const preview = document.getElementById('cardsPreview');
      preview.innerHTML = '';
      generatedCards = [];

      for (let i = 0; i < count; i++) {
        const cells = generateCells(min, max, centerFree);
        if (!cells) return;
        generatedCards.push(cells);
      }

      for (let i = 0; i < generatedCards.length; i += 2) {
        const page = document.createElement('div');
        page.className = 'bg-white rounded shadow-md2 p-6 mb-4 flex flex-wrap gap-5 justify-center';
        page.innerHTML = cardHTML(generatedCards[i]);
        if (generatedCards[i + 1]) page.innerHTML += cardHTML(generatedCards[i + 1]);
        preview.appendChild(page);
      }

      document.getElementById('printBtn').style.display = '';
      document.getElementById('cardsPreview').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== Canvas → PDF =====
    const PW = 1748, PH = 1240, PAD = 60, GAP = 48;

    function drawCard(ctx, cells, x, y, w, h) {
      const cellW = w / 5, cellH = cellW;
      const HEADER_H = h - cellH * 5;

      ctx.fillStyle = 'white';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#1A237E';
      ctx.fillRect(x, y, w, HEADER_H);

      const headers = ['B','I','N','G','O'];
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(HEADER_H * 0.72)}px Arial, sans-serif`;
      for (let i = 0; i < 5; i++) {
        ctx.fillText(headers[i], x + cellW * i + cellW / 2, y + HEADER_H / 2);
      }

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const cx = x + cellW * col;
          const cy = y + HEADER_H + cellH * row;
          const val = cells[row * 5 + col];

          if (val === null) {
            ctx.fillStyle = '#FFF8E1';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#E65100';
            ctx.font = `700 ${Math.round(cellH * 0.38)}px Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('FREE', cx + cellW / 2, cy + cellH / 2);
          } else {
            ctx.fillStyle = 'white';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#1A237E';
            const text = String(val);
            let fs = Math.round(cellH * 0.85);
            ctx.font = `700 ${fs}px Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            while (ctx.measureText(text).width > cellW * 0.86 && fs > 20) {
              fs -= 2;
              ctx.font = `700 ${fs}px Arial, sans-serif`;
            }
            ctx.fillText(text, cx + cellW / 2, cy + cellH / 2);
          }

          ctx.strokeStyle = '#C5CAE9';
          ctx.lineWidth = 2;
          ctx.strokeRect(cx, cy, cellW, cellH);
        }
      }

      ctx.strokeStyle = '#1A237E';
      ctx.lineWidth = 5;
      ctx.strokeRect(x, y, w, h);
    }

    function printCards() {
      if (!generatedCards.length) return;

      const cardW = Math.round((PW - PAD * 2 - GAP) / 2);
      const cellW = cardW / 5;
      const headerH = Math.round(cellW * 0.8);
      const cardH = headerH + Math.round(cellW * 5);
      const cardY = PAD + Math.round((PH - PAD * 2 - cardH) / 2);
      const dataURLs = [];

      for (let i = 0; i < generatedCards.length; i += 2) {
        const canvas = document.createElement('canvas');
        canvas.width = PW; canvas.height = PH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, PW, PH);
        drawCard(ctx, generatedCards[i], PAD, cardY, cardW, cardH);
        if (generatedCards[i + 1]) {
          drawCard(ctx, generatedCards[i + 1], PAD + cardW + GAP, cardY, cardW, cardH);
        }
        dataURLs.push(canvas.toDataURL('image/png'));
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      for (let i = 0; i < dataURLs.length; i++) {
        if (i > 0) doc.addPage();
        doc.addImage(dataURLs[i], 'PNG', 0, 0, 297, 210);
      }

      const url = URL.createObjectURL(doc.output('blob'));
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
