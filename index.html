<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴカード生成</title>
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #e8eaf6;
      padding: 24px;
      color: #222;
    }

    /* ===== UI PANEL ===== */
    .screen-only h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 24px;
      color: #1a237e;
      letter-spacing: 2px;
    }

    .settings-panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 560px;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .setting-row:last-child { margin-bottom: 0; }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-item label {
      font-size: 12px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-item input,
    .setting-item select {
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      transition: border-color 0.2s;
    }
    .setting-item input:focus,
    .setting-item select:focus {
      outline: none;
      border-color: #3f51b5;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .btn {
      padding: 13px 34px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); }
    .btn-generate { background: #43a047; color: white; }
    .btn-print    { background: #1e88e5; color: white; }

    /* ===== SCREEN CARD LAYOUT ===== */
    .page-wrapper {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.13);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
    }

    .bingo-card {
      width: clamp(280px, calc(50% - 12px), 420px);
      border: 3px solid #1a237e;
      border-radius: 4px;
      overflow: hidden;
    }

    .bingo-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #1a237e;
    }

    .bingo-header-cell {
      color: white;
      font-size: clamp(24px, 5vw, 48px);
      font-weight: 900;
      text-align: center;
      padding: 4% 0;
      border-right: 1px solid rgba(255,255,255,0.2);
    }
    .bingo-header-cell:last-child { border-right: none; }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .bingo-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 6.5vw, 70px);
      font-weight: 800;
      border: 1px solid #9fa8da;
      color: #1a237e;
      background: white;
    }

    .bingo-cell.free-cell {
      background: #fff9c4;
      font-size: clamp(15px, 3.2vw, 34px);
      font-weight: 900;
      color: #f57f17;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="screen-only">
    <h1>ビンゴカード生成</h1>

    <div class="settings-panel">
      <div class="setting-row">
        <div class="setting-item">
          <label>数字の最小値</label>
          <input type="number" id="numMin" value="1" min="1" max="999">
        </div>
        <div class="setting-item">
          <label>数字の最大値</label>
          <input type="number" id="numMax" value="75" min="1" max="999">
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-item">
          <label>生成枚数</label>
          <input type="number" id="numCards" value="2" min="1" max="100">
        </div>
        <div class="setting-item">
          <label>真ん中のマス</label>
          <select id="centerType">
            <option value="free">FREE（穴あき）</option>
            <option value="number">数字</option>
          </select>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-generate" onclick="generateCards()">生成</button>
      <button class="btn btn-print" id="printBtn" onclick="printCards()" style="display:none">印刷</button>
    </div>
  </div>

  <div id="cardsPreview"></div>

  <script>
    let generatedCards = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateCells(min, max, centerFree) {
      const needed = centerFree ? 24 : 25;
      const pool = [];
      for (let i = min; i <= max; i++) pool.push(i);
      if (pool.length < needed) {
        alert(`数字の範囲が足りません。${needed}個以上の数字が必要ですが、現在 ${pool.length} 個です。`);
        return null;
      }
      const nums = shuffle(pool).slice(0, needed);
      const cells = [];
      for (let i = 0; i < 25; i++) {
        if (centerFree && i === 12) {
          cells.push(null);
        } else {
          cells.push(nums.pop());
        }
      }
      return cells;
    }

    function cardHTML(cells) {
      const headers = ['B', 'I', 'N', 'G', 'O'];
      let h = '<div class="bingo-card">';
      h += '<div class="bingo-header">';
      for (const ch of headers) {
        h += `<div class="bingo-header-cell">${ch}</div>`;
      }
      h += '</div><div class="bingo-grid">';
      for (const val of cells) {
        if (val === null) {
          h += '<div class="bingo-cell free-cell">FREE</div>';
        } else {
          h += `<div class="bingo-cell">${val}</div>`;
        }
      }
      h += '</div>';
      h += '</div>';
      return h;
    }

    function generateCards() {
      const min = parseInt(document.getElementById('numMin').value, 10);
      const max = parseInt(document.getElementById('numMax').value, 10);
      const count = parseInt(document.getElementById('numCards').value, 10);
      const centerFree = document.getElementById('centerType').value === 'free';

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('最小値は最大値より小さい値を入力してください。');
        return;
      }

      const preview = document.getElementById('cardsPreview');
      preview.innerHTML = '';
      generatedCards = [];

      for (let i = 0; i < count; i++) {
        const cells = generateCells(min, max, centerFree);
        if (!cells) return;
        generatedCards.push(cells);
      }

      for (let i = 0; i < generatedCards.length; i += 2) {
        const page = document.createElement('div');
        page.className = 'page-wrapper';
        page.innerHTML = cardHTML(generatedCards[i]);
        if (generatedCards[i + 1]) {
          page.innerHTML += cardHTML(generatedCards[i + 1]);
        }
        preview.appendChild(page);
      }

      document.getElementById('printBtn').style.display = 'inline-block';
      document.getElementById('cardsPreview').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== Canvas-based print =====

    // A4横 at ~150dpi
    const PW = 1748, PH = 1240;
    const PAD = 60, GAP = 48;

    function drawCard(ctx, cells, x, y, w, h) {
      const cellW = w / 5;
      const cellH = cellW; // 正方形セル
      const HEADER_H = h - cellH * 5; // 残りをヘッダーに

      // カード背景
      ctx.fillStyle = 'white';
      ctx.fillRect(x, y, w, h);

      // ヘッダー背景
      ctx.fillStyle = '#1a237e';
      ctx.fillRect(x, y, w, HEADER_H);

      // ヘッダー文字
      const headers = ['B', 'I', 'N', 'G', 'O'];
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const headerFontSize = Math.round(HEADER_H * 0.72);
      ctx.font = `900 ${headerFontSize}px Arial, sans-serif`;
      for (let i = 0; i < 5; i++) {
        ctx.fillText(headers[i], x + cellW * i + cellW / 2, y + HEADER_H / 2);
      }

      // セル
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const idx = row * 5 + col;
          const cx = x + cellW * col;
          const cy = y + HEADER_H + cellH * row;
          const val = cells[idx];

          if (val === null) {
            // FREE
            ctx.fillStyle = '#fff9c4';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#f57f17';
            ctx.font = `900 ${Math.round(cellH * 0.38)}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('FREE', cx + cellW / 2, cy + cellH / 2);
          } else {
            ctx.fillStyle = 'white';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#1a237e';
            const text = String(val);
            // 数字をセル幅に合わせて最大化
            let fontSize = Math.round(cellH * 0.85);
            ctx.font = `800 ${fontSize}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            while (ctx.measureText(text).width > cellW * 0.86 && fontSize > 20) {
              fontSize -= 2;
              ctx.font = `800 ${fontSize}px Arial, sans-serif`;
            }
            ctx.fillText(text, cx + cellW / 2, cy + cellH / 2);
          }

          // セル枠線
          ctx.strokeStyle = '#9fa8da';
          ctx.lineWidth = 2;
          ctx.strokeRect(cx, cy, cellW, cellH);
        }
      }

      // カード枠線
      ctx.strokeStyle = '#1a237e';
      ctx.lineWidth = 6;
      ctx.strokeRect(x, y, w, h);
    }

    function printCards() {
      if (generatedCards.length === 0) return;

      // cellWを決めてcardHを逆算し正方形セルにする
      const cardW = Math.round((PW - PAD * 2 - GAP) / 2);
      const cellW = cardW / 5;
      const headerH = Math.round(cellW * 0.8); // BINGOヘッダー高さ
      const cardH = headerH + Math.round(cellW * 5);
      // 縦方向センタリング
      const cardY = PAD + Math.round((PH - PAD * 2 - cardH) / 2);
      const dataURLs = [];

      for (let i = 0; i < generatedCards.length; i += 2) {
        const canvas = document.createElement('canvas');
        canvas.width = PW;
        canvas.height = PH;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, PW, PH);

        drawCard(ctx, generatedCards[i], PAD, cardY, cardW, cardH);
        if (generatedCards[i + 1]) {
          drawCard(ctx, generatedCards[i + 1], PAD + cardW + GAP, cardY, cardW, cardH);
        }

        dataURLs.push(canvas.toDataURL('image/png'));
      }

      const imgTags = dataURLs.map(url =>
        `<img src="${url}" style="width:297mm;height:210mm;display:block;page-break-after:always;break-after:page;">`
      ).join('\n');

      const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  @page { size: A4 landscape; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: white; }
  img:last-child { page-break-after: avoid; break-after: avoid; }
</style></head>
<body>
${imgTags}
<script>window.onload = function(){ setTimeout(function(){ window.print(); }, 400); }<\/script>
</body></html>`;

      const win = window.open('', '_blank');
      if (win) {
        win.document.write(html);
        win.document.close();
      } else {
        alert('ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。');
      }
    }
  </script>

</body>
</html>
