<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴカード生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Roboto', sans-serif; background: #F8FAFC; }
    h1, button { font-family: 'Google Sans', 'Roboto', sans-serif; }

    /* MD3 Filled Text Field */
    .m3-field { position: relative; }
    .m3-field input,
    .m3-field select {
      width: 100%;
      background: #F1F5F9;
      border: none;
      border-bottom: 1px solid #94A3B8;
      border-radius: 4px 4px 0 0;
      padding: 22px 16px 6px;
      font-size: 16px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      color: #1D1B20;
      outline: none;
      transition: border-color .2s, background .2s;
      appearance: none;
    }
    .m3-field input:focus,
    .m3-field select:focus {
      background: #E2E8F0;
      border-bottom: 2px solid #334155;
    }
    .m3-field label {
      position: absolute;
      top: 7px; left: 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .5px;
      color: #334155;
      pointer-events: none;
      text-transform: uppercase;
    }

    /* MD3 Filled Button */
    .m3-btn {
      border: none; cursor: pointer;
      border-radius: 8px;
      padding: 0 28px; height: 44px;
      font-family: 'Google Sans', 'Roboto', sans-serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: .25px;
      transition: box-shadow .2s, filter .15s;
    }
    .m3-btn:hover   { filter: brightness(0.94); }
    .m3-btn:active  { filter: brightness(0.88); box-shadow: none !important; }

    /* Bingo card */
    .bingo-card {
      width: clamp(260px, calc(50% - 12px), 400px);
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(30,41,59,.18);
    }
    .bingo-header {
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: #1E293B;
    }
    .bingo-header-cell {
      color: white; font-size: clamp(20px, 4.2vw, 42px);
      font-weight: 700; text-align: center; padding: 4% 0;
      border-right: 1px solid rgba(255,255,255,.1);
      font-family: 'Google Sans', sans-serif;
    }
    .bingo-header-cell:last-child { border-right: none; }
    .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); }
    .bingo-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: clamp(22px, 5vw, 56px); font-weight: 700;
      border: 1px solid #CBD5E1; color: #0F172A; background: white;
      font-family: 'Google Sans', sans-serif;
    }
    .bingo-cell.free-cell {
      background: #FFF3E0; font-size: clamp(12px, 2.5vw, 26px);
      font-weight: 500; color: #BF360C; letter-spacing: .3px;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Top App Bar (MD3 medium) -->
  <header style="background:#1E293B;" class="px-5 pt-3 pb-4">
    <p class="text-xs font-medium" style="color:#94A3B8; letter-spacing:.5px;">BINGO</p>
    <h1 class="text-white text-2xl font-medium mt-0.5 tracking-wide">ビンゴカード生成</h1>
  </header>

  <main class="max-w-lg mx-auto px-4 py-6 flex flex-col gap-4">

    <!-- Settings card (MD3 Surface) -->
    <div class="bg-white rounded-2xl p-6" style="box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);">

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="m3-field">
          <label>最小値</label>
          <input type="number" id="numMin" value="1" min="1" max="999">
        </div>
        <div class="m3-field">
          <label>最大値</label>
          <input type="number" id="numMax" value="75" min="1" max="999">
        </div>
        <div class="m3-field">
          <label>生成枚数</label>
          <input type="number" id="numCards" value="2" min="1" max="100">
        </div>
        <div class="m3-field">
          <label>中央マス</label>
          <select id="centerType">
            <option value="free">FREE</option>
            <option value="number">数字</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-2">
        <button onclick="generateCards()" class="m3-btn text-white"
          style="background:#334155; box-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.15);">
          生成
        </button>
        <button id="printBtn" onclick="printCards()"
          style="display:none; background:#0F172A; box-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.15);"
          class="m3-btn text-white">
          PDF 出力
        </button>
      </div>

    </div>

  </main>

  <!-- Slider -->
  <section id="sliderSection" class="pb-8 max-w-lg mx-auto px-4" style="display:none">
    <!-- Nav bar -->
    <div class="flex items-center justify-between mb-3">
      <button id="prevBtn" onclick="slidePrev()"
        class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-lg font-bold disabled:opacity-30"
        style="background:#334155;" disabled>‹</button>
      <span id="slideCounter" class="text-sm font-medium" style="color:#475569;">1 / 1</span>
      <button id="nextBtn" onclick="slideNext()"
        class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-lg font-bold disabled:opacity-30"
        style="background:#334155;" disabled>›</button>
    </div>
    <div id="sliderTrack"
      class="flex overflow-x-hidden"
      style="scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;">
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let generatedCards = [];
    let currentSlide = 0, totalSlides = 0;

    function slideTo(idx) {
      const track = document.getElementById('sliderTrack');
      currentSlide = Math.max(0, Math.min(idx, totalSlides - 1));
      track.scrollTo({ left: currentSlide * track.clientWidth, behavior: 'smooth' });
      document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${totalSlides}`;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }
    function slidePrev() { slideTo(currentSlide - 1); }
    function slideNext() { slideTo(currentSlide + 1); }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateCells(min, max, centerFree) {
      const needed = centerFree ? 24 : 25;
      const pool = [];
      for (let i = min; i <= max; i++) pool.push(i);
      if (pool.length < needed) {
        alert(`数字の範囲が足りません。${needed}個以上必要ですが現在 ${pool.length} 個です。`);
        return null;
      }
      const nums = shuffle(pool).slice(0, needed);
      const cells = [];
      for (let i = 0; i < 25; i++) {
        cells.push((centerFree && i === 12) ? null : nums.pop());
      }
      return cells;
    }

    function cardHTML(cells) {
      const headers = ['B','I','N','G','O'];
      let h = '<div class="bingo-card"><div class="bingo-header">';
      for (const ch of headers) h += `<div class="bingo-header-cell">${ch}</div>`;
      h += '</div><div class="bingo-grid">';
      for (const val of cells) {
        h += val === null
          ? '<div class="bingo-cell free-cell">FREE</div>'
          : `<div class="bingo-cell">${val}</div>`;
      }
      return h + '</div></div>';
    }

    function generateCards() {
      const min  = parseInt(document.getElementById('numMin').value, 10);
      const max  = parseInt(document.getElementById('numMax').value, 10);
      const count = parseInt(document.getElementById('numCards').value, 10);
      const centerFree = document.getElementById('centerType').value === 'free';

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('最小値は最大値より小さくしてください。');
        return;
      }

      generatedCards = [];

      for (let i = 0; i < count; i++) {
        const cells = generateCells(min, max, centerFree);
        if (!cells) return;
        generatedCards.push(cells);
      }

      const track = document.getElementById('sliderTrack');
      track.innerHTML = '';
      totalSlides = 0;

      for (let i = 0; i < generatedCards.length; i += 2) {
        const slide = document.createElement('div');
        slide.className = 'flex flex-wrap gap-4 justify-center items-start flex-shrink-0 w-full';
        slide.style.cssText = 'scroll-snap-align:start; min-width:100%;';
        slide.innerHTML = cardHTML(generatedCards[i]);
        if (generatedCards[i + 1]) slide.innerHTML += cardHTML(generatedCards[i + 1]);
        track.appendChild(slide);
        totalSlides++;
      }

      currentSlide = 0;
      document.getElementById('slideCounter').textContent = `1 / ${totalSlides}`;
      document.getElementById('prevBtn').disabled = true;
      document.getElementById('nextBtn').disabled = totalSlides <= 1;

      document.getElementById('printBtn').style.display = '';
      document.getElementById('sliderSection').style.display = '';
      document.getElementById('sliderSection').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== Canvas → PDF =====
    const PW = 1748, PH = 1240, PAD = 60, GAP = 48;

    function drawCard(ctx, cells, x, y, w, h) {
      const cellW = w / 5, cellH = cellW;
      const HEADER_H = h - cellH * 5;

      ctx.fillStyle = 'white';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(x, y, w, HEADER_H);

      const headers = ['B','I','N','G','O'];
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(HEADER_H * 0.72)}px Arial, sans-serif`;
      for (let i = 0; i < 5; i++) {
        ctx.fillText(headers[i], x + cellW * i + cellW / 2, y + HEADER_H / 2);
      }

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const cx = x + cellW * col;
          const cy = y + HEADER_H + cellH * row;
          const val = cells[row * 5 + col];

          if (val === null) {
            ctx.fillStyle = '#FFF3E0';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#BF360C';
            ctx.font = `500 ${Math.round(cellH * 0.38)}px Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('FREE', cx + cellW / 2, cy + cellH / 2);
          } else {
            ctx.fillStyle = 'white';
            ctx.fillRect(cx, cy, cellW, cellH);
            ctx.fillStyle = '#0F172A';
            const text = String(val);
            let fs = Math.round(cellH * 0.85);
            ctx.font = `700 ${fs}px Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            while (ctx.measureText(text).width > cellW * 0.86 && fs > 20) {
              fs -= 2;
              ctx.font = `700 ${fs}px Arial, sans-serif`;
            }
            ctx.fillText(text, cx + cellW / 2, cy + cellH / 2);
          }

          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 2;
          ctx.strokeRect(cx, cy, cellW, cellH);
        }
      }

      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 5;
      ctx.strokeRect(x, y, w, h);
    }

    function printCards() {
      if (!generatedCards.length) return;

      const cardW = Math.round((PW - PAD * 2 - GAP) / 2);
      const cellW = cardW / 5;
      const headerH = Math.round(cellW * 0.8);
      const cardH = headerH + Math.round(cellW * 5);
      const cardY = PAD + Math.round((PH - PAD * 2 - cardH) / 2);
      const dataURLs = [];

      for (let i = 0; i < generatedCards.length; i += 2) {
        const canvas = document.createElement('canvas');
        canvas.width = PW; canvas.height = PH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, PW, PH);
        drawCard(ctx, generatedCards[i], PAD, cardY, cardW, cardH);
        if (generatedCards[i + 1]) {
          drawCard(ctx, generatedCards[i + 1], PAD + cardW + GAP, cardY, cardW, cardH);
          // 切り取り線（2枚目がある場合のみ）
          const cutX = Math.round(PAD + cardW + GAP / 2);
          ctx.save();
          ctx.strokeStyle = '#AAAAAA';
          ctx.lineWidth = 3;
          ctx.setLineDash([18, 12]);
          ctx.beginPath();
          ctx.moveTo(cutX, 0);
          ctx.lineTo(cutX, PH);
          ctx.stroke();
          ctx.setLineDash([]);
          // ハサミ記号（上・下）
          ctx.font = '56px Arial';
          ctx.fillStyle = '#AAAAAA';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('✂', cutX, 48);
          ctx.save();
          ctx.translate(cutX, PH - 48);
          ctx.rotate(Math.PI);
          ctx.fillText('✂', 0, 0);
          ctx.restore();
          ctx.restore();
        }
        dataURLs.push(canvas.toDataURL('image/png'));
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      for (let i = 0; i < dataURLs.length; i++) {
        if (i > 0) doc.addPage();
        doc.addImage(dataURLs[i], 'PNG', 0, 0, 297, 210);
      }

      const url = URL.createObjectURL(doc.output('blob'));
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
